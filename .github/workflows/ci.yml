# Tests every pull request and every push to main, and is called by the
# release workflow so a release is tested here too, never only on a
# developer's machine where the tests could have been skipped.
#
# DSC_REQUIRE_CATALOGUE turns the tests that skip without data/catalogue into
# failures, so a missing catalogue cannot pass by skipping.

name: CI

# Prose only is not tested: README.md and docs/ feed no build. Other .md files
# do, so they are not listed: VERSION.md is the version, and
# THIRD_PARTY_NOTICES.md ships in the installer.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
  workflow_call:
    inputs:
      build_installer:
        description: Also build the installer. The release builds its own.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DSC_REQUIRE_CATALOGUE: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Versions agree with VERSION.md
        run: python tools/version.py --check

      # The editor crate embeds editor/dist at compile time, so the frontend
      # has to exist before cargo test compiles the workspace.
      - name: Build the editor frontend
        working-directory: editor
        run: |
          npm ci
          npm run build

      - name: Fetch the pinned DCS-BIOS nightly and build the catalogue
        run: python tools/fetch_bios.py --build-catalogue

      # The editor's build script checks that everything the installer
      # bundles exists, even for a test build, and that includes the daemon.
      - name: Build the daemon the editor bundles
        run: cargo build --release --locked --bin dcs-signal

      - name: Test
        run: cargo test --workspace --locked

      - name: Build the installer
        if: inputs.build_installer != false
        working-directory: editor
        run: npx tauri build
