[workspace]
resolver = "2"
members = [
    "crates/wctrl-hid",
    "crates/dsc-bios",
    "crates/dsc-config",
    "crates/dsc-engine",
    "crates/dsc-cli",
    "editor/src-tauri",
]

[workspace.package]
version = "1.0.0-alpha.3"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
socket2 = { version = "0.5", features = ["all"] }
