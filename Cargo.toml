[workspace]
resolver = "2"
members = [
    "crates/wctrl-hid",
    "crates/wctrl-bios",
    "crates/wctrl-config",
    "crates/wctrl-engine",
    "crates/wctrl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
socket2 = { version = "0.5", features = ["all"] }
