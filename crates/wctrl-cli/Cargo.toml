[package]
name = "wctrl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless driver and diagnostics for the WinCtrl signal converter"

[[bin]]
name = "wctrl"
path = "src/main.rs"

[dependencies]
wctrl-hid = { path = "../wctrl-hid" }
wctrl-bios = { path = "../wctrl-bios" }
wctrl-config = { path = "../wctrl-config" }
wctrl-engine = { path = "../wctrl-engine" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
serde_json.workspace = true
