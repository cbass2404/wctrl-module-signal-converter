<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- DCS Signal Converter: a lit panel lamp with the signal reaching it.
       Same tile and palette as the afterburner detent app, so the two read as
       one family. Regenerate the .ico with: npx tauri icon src-tauri/icons/icon.svg -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffce4a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="#1e2530"/>
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <g fill="none" stroke="#ff7a18" stroke-width="64" stroke-linecap="round">
    <path d="M 300 330 A 250 250 0 0 0 300 694"/>
    <path d="M 724 330 A 250 250 0 0 1 724 694"/>
    <path d="M 196 250 A 370 370 0 0 0 196 774"/>
    <path d="M 828 250 A 370 370 0 0 1 828 774"/>
  </g>
  <circle cx="512" cy="512" r="150" fill="#ff7a18"/>
  <circle cx="512" cy="512" r="96" fill="#ffce4a"/>
</svg>
